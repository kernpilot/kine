formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
linters:
  default: none
  enable:
    - govet
    - revive
  settings:
    revive:
      enable-all-rules: true
      rules:
        - {name: add-constant, disabled: true}
        - {name: cognitive-complexity, disabled: true}
        - {name: confusing-naming, disabled: true}
        - {name: confusing-results, disabled: true}
        - {name: cyclomatic, disabled: true}
        - {name: early-return, disabled: true}
        - {name: enforce-switch-style, disabled: true}
        - {name: flag-parameter, disabled: true}
        - {name: function-length, disabled: true}
        - {name: function-result-limit, disabled: true}
        - {name: import-shadowing, disabled: true}
        - {name: line-length-limit, disabled: true}
        - {name: max-control-nesting, disabled: true}
        - {name: max-public-structs, disabled: true}
        - {name: unused-parameter, disabled: true}
        - {name: unused-receiver, disabled: true}
        - {name: use-waitgroup-go, disabled: true}
        - {name: var-naming, disabled: true}
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # KUBEHZ-PATCH lint BEGIN
    # INTENT: golangci-lint v2.15.0 (pr.yml) finds 0 issues, and upstream's
    # code stays as it is. Each rule names what it hides.
    rules:
      # Upstream code: a Close of database/sql (std-error-handling already
      # exempts .*Close for errcheck) and strings.Builder.WriteString,
      # which always returns nil. The kubehz_* files stay checked.
      - linters: [revive]
        path-except: kubehz_
        text: '^unhandled-error: Unhandled error in call to function (database/sql\.(DB|Rows|Stmt)\.Close|database/sql/driver\.Conn\.Close|strings\.Builder\.WriteString)$'
      # Upstream's test helper.
      - linters: [revive]
        path: pkg/testserver/test_server\.go
        text: '^unhandled-error: Unhandled error in call to function os\.Chmod$'
      # The name of upstream's package pkg/util.
      - linters: [revive]
        path: pkg/util/
        text: '^package-naming: don.t use "util" because'
      # A style rule. The fork's files use a multi-line init statement,
      # as in `if err := raw.Control(func(fd uintptr) {...}); err != nil`.
      - linters: [revive]
        text: '^multiline-if-init:'
    # KUBEHZ-PATCH lint END
version: "2"
