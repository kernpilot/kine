name: Unit Tests
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/workflows/actionlint.yaml"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/workflows/actionlint.yaml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # kubehz fork: a real PostgreSQL for the P2/P3 integration test
    # (pkg/drivers/pgsql/kubehz_pgsql_test.go, gated on KINE_TEST_PGSQL_DSN).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KINE_TEST_PGSQL_DSN: postgres://postgres:postgres@localhost:5432/kine_kubehz_test?sslmode=disable
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Go Unit Tests
      run: go test -cover -tags=test ./...
      env:
        CGO_ENABLED: "1"

    - name: Go Unit Tests nocgo
      run: go test -cover -tags=test ./...
      env:
        CGO_ENABLED: "0"

    # kubehz fork: the P1 tests (kubehz/MERGE-GUIDE.md#p1) are hermetic and
    # already ran above. This step makes their ABSENCE a failure: a rebase
    # that drops a test file would otherwise pass on an empty -run.
    - name: kubehz P1 tests exist and pass
      run: |
        set -euo pipefail
        for pkg in ./pkg/drivers/pgsql/ ./pkg/logstructured/sqllog/; do
          # Capture first: `grep -q` in a pipe can exit before `go` finishes
          # writing, and pipefail would then report a false failure.
          names=$(go test -tags=test -list 'TestKubehzP1' "$pkg")
          grep -q '^TestKubehzP1' <<<"$names" \
            || { echo "::error::no TestKubehzP1* test in $pkg (see kubehz/MERGE-GUIDE.md)"; exit 1; }
        done
        go test -tags=test -count=1 -race -run 'TestKubehzP1' ./pkg/drivers/pgsql/ ./pkg/logstructured/sqllog/

    # kubehz fork: same guard for the P2 tests (kubehz/MERGE-GUIDE.md#p2).
    - name: kubehz P2 tests exist and pass
      run: |
        set -euo pipefail
        pkgs="./pkg/server/ ./pkg/app/ ./pkg/endpoint/ ./pkg/drivers/pgsql/ ./pkg/logstructured/sqllog/"
        for pkg in $pkgs; do
          names=$(go test -tags=test -list 'TestKubehzP2' "$pkg")
          grep -q '^TestKubehzP2' <<<"$names" \
            || { echo "::error::no TestKubehzP2* test in $pkg (see kubehz/MERGE-GUIDE.md)"; exit 1; }
        done
        # shellcheck disable=SC2086 # $pkgs is a space-separated list on purpose
        go test -tags=test -count=1 -race -run 'TestKubehzP2' $pkgs

    # kubehz fork: same guard for the P3 tests (kubehz/MERGE-GUIDE.md#p3).
    - name: kubehz P3 tests exist and pass
      run: |
        set -euo pipefail
        names=$(go test -tags=test -list 'TestKubehzP3' ./pkg/drivers/pgsql/)
        grep -q '^TestKubehzP3' <<<"$names" \
          || { echo "::error::no TestKubehzP3* test in ./pkg/drivers/pgsql/ (see kubehz/MERGE-GUIDE.md)"; exit 1; }
        go test -tags=test -count=1 -race -run 'TestKubehzP3' ./pkg/drivers/pgsql/
