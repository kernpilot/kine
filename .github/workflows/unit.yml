name: Unit Tests
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/workflows/actionlint.yaml"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/workflows/actionlint.yaml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Go Unit Tests
      run: go test -cover -tags=test ./...
      env:
        CGO_ENABLED: "1"

    - name: Go Unit Tests nocgo
      run: go test -cover -tags=test ./...
      env:
        CGO_ENABLED: "0"

    # kubehz fork: the P1 tests (kubehz/MERGE-GUIDE.md#p1) are hermetic and
    # already ran above. This step makes their ABSENCE a failure: a rebase
    # that drops a test file would otherwise pass on an empty -run.
    - name: kubehz P1 tests exist and pass
      run: |
        set -euo pipefail
        for pkg in ./pkg/drivers/pgsql/ ./pkg/logstructured/sqllog/; do
          # Capture first: `grep -q` in a pipe can exit before `go` finishes
          # writing, and pipefail would then report a false failure.
          names=$(go test -tags=test -list 'TestKubehzP1' "$pkg")
          grep -q '^TestKubehzP1' <<<"$names" \
            || { echo "::error::no TestKubehzP1* test in $pkg (see kubehz/MERGE-GUIDE.md)"; exit 1; }
        done
        go test -tags=test -count=1 -race -run 'TestKubehzP1' ./pkg/drivers/pgsql/ ./pkg/logstructured/sqllog/
